server:
  port: 14070
  shutdown: graceful

spring:
  config:
    import:
      - optional:file:../config/querchecker.yml
  lifecycle:
    timeout-per-shutdown-phase: 5s # Fast DevTools restarts without waiting for long-lived connections (SSE)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true
    out-of-order: true
  datasource:
    url: jdbc:postgresql://localhost:14071/mydb
    username: myuser
    password: mypassword
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

querchecker:
  wh:
    refresh:
      cron: "0 0 3 * * MON" # montags 03:00; Spring-Cron: Sek Min Std Tag Mon Wochentag
  dl:
    item-text-cleanup:
      retention-days: 10 # ältere ItemText-Records löschen (nicht neuester + kein userCorrectedTerm)
      cron: "0 0 3 * * *" # täglich 03:00

logging:
  level:
    at.querchecker:
      deepLearning: DEBUG
      research: DEBUG
      extraction: DEBUG
      search: DEBUG
      willHaben: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
