spring:
  config:
    import:
      - optional:file:../config/secrets.ymld # API-Keys (nie in Git)

querchecker:
  # ---------------------------------------------------------------------------
  # LLM-Konfiguration (Extraction + Web-Lookup-Aufbereitung)
  # ---------------------------------------------------------------------------
  llm:
    mode: API # API | LOCAL — Neustart nötig bei Wechsel

    # Nur relevant bei mode: API
    # Bei API wird der suggestedTerm automatisch aus dem Provider-Namen abgeleitet
    # (GROQ → "groq", OPENROUTER → "openrouter") — kein separater source-model-Wert nötig
    external-provider: GROQ # GROQ | OPENROUTER

    # Nur relevant bei mode: LOCAL
    # Substring-Match gegen DlModelConfig.modelName — bestimmt welches lokale Modell
    # den suggestedTerm liefert. Aktive Modelle: llama-3.2-3b | qwen3-4b | nuextract-1.5
    # Kurzformen: "llama", "qwen", "nuextract"
    local-source-model: llama

    # Nur relevant bei mode: LOCAL
    # 0 = CPU-only; 999 = alle Layer auf GPU (llama.cpp begrenzt automatisch)
    gpu-layers: 0

  # ---------------------------------------------------------------------------
  # Web-Suche
  # ---------------------------------------------------------------------------
  api:
    search:
      #active-provider: BRAVE # BRAVE | GOOGLE_DISCOVERY — Neustart nötig bei Wechsel
      active-provider: GOOGLE_DISCOVERY # BRAVE | GOOGLE_DISCOVERY — Neustart nötig bei Wechsel

    # Nur relevant bei search.active-provider: GOOGLE_DISCOVERY
    google-discovery:
      project-id: querdenker-490819
      engine-id: querchecker-search-app_1774604635088 # Discovery Engine App-ID
      location: global # z.B. global oder eu
      credentials-path: ../config/querdenker-google-auth.json # relativ zum backend/-Arbeitsverzeichnis; oder absoluter Pfad
      language-code: # BCP-47 — beeinflusst Query-Interpretation; leer lassen = nicht gesetzt

    # Kontingente & Limits pro Provider
    limits:
      brave:
        free-limit: 1000
        free-limit-period: MONTHLY
        period-start-day: 1
        limit-unit: REQUESTS
        alert-at-percent: 80
      google-discovery:
        free-limit: 100
        free-limit-period: DAILY
        period-start-day: 1
        limit-unit: REQUESTS
        alert-at-percent: 80
      groq:
        model: llama-3.1-8b-instant # DL-Extraktion + erster QuickFacts-Lookup
        model-lookup-secondary: llama-3.3-70b-versatile # Folge-QuickFacts-Lookups (Quellen 2+)
        free-limit: 500000
        free-limit-period: DAILY
        period-start-day: 1
        limit-unit: TOKENS
        alert-at-percent: 80
      openrouter:
        model: meta-llama/llama-3.3-70b-instruc
        free-limit: 0
        free-limit-period: DAILY
        limit-unit: REQUESTS
        alert-at-percent: 80

  # ---------------------------------------------------------------------------
  # Deep Learning
  # ---------------------------------------------------------------------------
  dl:
    min-confidence: 0.0 # Evaluierungsphase: alle Ergebnisse speichern
    top-k: 5 # Filter VOR DB-Insert
