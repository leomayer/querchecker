<div class="popup-backdrop">
  <div class="popup-card">
    <div class="popup-header">
      <mat-icon class="warn-icon">warning</mat-icon>
      <h2>Einige Features sind nicht eingerichtet</h2>
    </div>

    <p class="popup-description">
      Bitte konfiguriere die erforderlichen KI-Services im Einrichtungs-Assistenten.
    </p>

    <div class="popup-actions">
      <button mat-flat-button color="primary" (click)="openSettings()">
        <mat-icon>build</mat-icon>
        Einrichtungs-Assistent
      </button>
      <button mat-button (click)="dismiss()">Später</button>
    </div>
  </div>
</div>
