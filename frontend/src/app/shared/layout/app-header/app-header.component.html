<mat-toolbar class="header-toolbar">
  <div class="toolbar-inner">
    <h1 class="brand-title">Leo's Querchecker</h1>
    <span class="spacer"></span>
    <button
      mat-icon-button
      class="theme-toggle-btn"
      style="margin-right: 8px"
      (click)="toggleTheme()"
      [attr.aria-label]="themeAriaLabel()">
      <mat-icon>{{ themeIcon() }}</mat-icon>
    </button>
    <button
      mat-icon-button
      class="theme-toggle-btn settings-btn"
      (click)="navigateSettings()"
      aria-label="Einstellungen"
      [matBadge]="providerStatus.badgeVisible() ? '!' : ''"
      [matBadgeHidden]="!providerStatus.badgeVisible()"
      [matBadgeColor]="settingsBadgeColor()"
      >
      <mat-icon>settings</mat-icon>
    </button>
  </div>
</mat-toolbar>
