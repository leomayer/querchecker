<!-- Row 1: decision controls + notes toggle -->
<div class="action-row">
  <div class="decision-row">
    <mat-button-toggle-group
      class="verdict-group"
      [value]="store.verdict()"
      hideSingleSelectionIndicator>
      <mat-button-toggle value="UP" matTooltip="Weiter / Interessiert" (click)="onVerdict('UP')">
        <mat-icon>thumb_up</mat-icon>
      </mat-button-toggle>
      <mat-button-toggle value="DOWN" matTooltip="Überspringen" (click)="onVerdict('DOWN')">
        <mat-icon>thumb_down</mat-icon>
      </mat-button-toggle>
    </mat-button-toggle-group>

    <mat-button-toggle-group
      class="interest-group"
      [value]="store.interestLevel()"
      hideSingleSelectionIndicator>
      <mat-button-toggle value="LOW" matTooltip="Kaum interessant" (click)="onInterestClick('LOW')">
        <mat-icon class="interest-low">local_fire_department</mat-icon>
      </mat-button-toggle>
      <mat-button-toggle
        value="MEDIUM"
        matTooltip="Interessant"
        (click)="onInterestClick('MEDIUM')">
        <mat-icon class="interest-medium">local_fire_department</mat-icon>
      </mat-button-toggle>
      <mat-button-toggle
        value="HIGH"
        matTooltip="Sehr interessant"
        (click)="onInterestClick('HIGH')">
        <mat-icon class="interest-high">local_fire_department</mat-icon>
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  <div class="notes-split-btn" [class.is-open]="notesOpen()">
    <button
      mat-icon-button
      class="split-main"
      (click)="toggleNotes()"
      [matTooltip]="notesBtnTooltip()">
      <mat-icon>{{ notesBtnIcon() }}</mat-icon>
    </button>
    <span class="split-sep" aria-hidden="true"></span>
    <button mat-icon-button class="split-arrow" (click)="toggleNotes()">
      <mat-icon>keyboard_arrow_down</mat-icon>
    </button>
  </div>
</div>

<!-- Row 2: notes (collapsible) -->
@if (notesOpen()) {
  <div class="notes-section">
    <mat-form-field class="notes-field" subscriptSizing="dynamic">
      <mat-label>Notizen zum Inserat</mat-label>
      <textarea
        matInput
        cdkTextareaAutosize
        cdkAutosizeMinRows="3"
        #notesRef="cdkTextareaAutosize"
        [ngModel]="store.notes()"
        (ngModelChange)="store.updateNotes($event)"
        placeholder="Notizen zum Inserat…">
      </textarea>
    </mat-form-field>
    <div class="notes-actions">
      <button mat-icon-button (click)="clearNote()" matTooltip="Notiz löschen">
        <mat-icon>delete</mat-icon>
      </button>
      <div class="save-state-wrap" [matTooltip]="saveStateTooltip()">
        @if (store.saveState() === 'pending') {
          <mat-spinner diameter="20" />
        } @else {
          <mat-icon [class]="'save-icon save-' + saveStateClass()">{{ saveStateIcon() }}</mat-icon>
        }
      </div>
    </div>
  </div>
}
