@if (!store.status()) {
  <p class="loading-hint">Status wird geladen…</p>
} @else {
  <app-provider-status-table />

  @if (canSetup()) {
    <div class="provider-actions">
      <button mat-stroked-button disabled>
        <mat-icon>build</mat-icon>
        Einrichtungs-Assistent
      </button>
      <span class="action-hint">Kommt in Block C</span>
    </div>
  }
}
