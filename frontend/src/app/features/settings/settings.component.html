<div class="settings-page">
  <div class="settings-header">
    <button mat-icon-button (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2>Einstellungen</h2>
  </div>

  <mat-accordion class="settings-accordion" multi>

    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <mat-icon class="panel-icon">palette</mat-icon>
          Design
        </mat-panel-title>
      </mat-expansion-panel-header>
      <app-theme-toggle />
    </mat-expansion-panel>

    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <mat-icon class="panel-icon">token</mat-icon>
          KI-Extraktion
        </mat-panel-title>
      </mat-expansion-panel-header>
      <app-dl-extraction-settings />
    </mat-expansion-panel>

    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <mat-icon class="panel-icon">auto_awesome</mat-icon>
          Kategorie-Präferenzen
        </mat-panel-title>
      </mat-expansion-panel-header>
      <app-category-preferences />
    </mat-expansion-panel>

    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <mat-icon class="panel-icon" [class.warn-icon]="usageHasWarning()">
            {{ usageHasWarning() ? 'warning' : 'monitoring' }}
          </mat-icon>
          API-Verbrauch
          @if (usageHasWarning()) {
            <span class="warn-badge">Kontingent fast voll</span>
          }
        </mat-panel-title>
      </mat-expansion-panel-header>
      <app-usage-monitor (warningChange)="usageHasWarning.set($event)" />
    </mat-expansion-panel>

    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <mat-icon class="panel-icon">delete_sweep</mat-icon>
          Aufräumen
        </mat-panel-title>
      </mat-expansion-panel-header>
      <app-delete-sweep />
    </mat-expansion-panel>

  </mat-accordion>
</div>
